<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLET - Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
        }
        button, input, select {
            font-family: inherit;
            font-size: 17px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            color: #333;
            letter-spacing: 2px;
            font-size: 42px;
        }
        h2 { font-size: 28px; }
        h3 { font-size: 24px; }
        h4 { font-size: 20px; }
        .main-container {
            display: flex;
            gap: 20px;
        }
        /* Sidebar Filters */
        .sidebar {
            width: 290px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            align-self: flex-start;
        }
        .sidebar h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .filter-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            font-size: 17px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .sidebar-divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 12px 0;
        }
        .btn-payments-list {
            background: #17a2b8;
            color: white;
            border-color: #17a2b8;
        }
        .btn-payments-list:hover {
            background: #138496;
            border-color: #138496;
        }
        /* Content Area */
        .content {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .content-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        /* Action Buttons */
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
        }
        .btn-add { background: #28a745; color: white; }
        .btn-group { background: #6610f2; color: white; }
        .btn-close-month { background: #dc3545; color: white; }
        .btn-save { background: #17a2b8; color: white; }
        .btn-info { background: #ffc107; color: #333; }
        .btn-delete { background: #bd2130; color: white; border-radius: 50%; width: 36px; height: 36px; padding: 0; font-size: 16px; }

        /* Children List/Table */
        .child-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #eee;
            gap: 10px;
            flex-wrap: wrap;
        }
        .child-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 240px;
        }
        .child-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .child-name {
            font-weight: bold;
            font-size: 22px;
        }
        .child-meta {
            font-size: 16px;
            color: #777;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .assign-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eef4ff;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #d5e3ff;
        }
        .assign-group select { min-width: 190px; padding: 6px; }
        .controls select { padding: 8px 6px; }
        .history-text {
            font-size: 14px;
            color: #666;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Payment status select colors */
        .pay-select {
            font-weight: bold;
            border: none;
            border-radius: 4px;
            padding: 10px 8px;
            color: white;
            cursor: pointer;
        }
        .pay-select.unpaid {
            background-color: #dc3545;
        }
        .pay-select.paid {
            background-color: #28a745;
        }
        .pay-select option {
            color: #333;
            background: white;
        }

        /* Birthday design */
        .child-row.bday-soon {
            background: linear-gradient(90deg, #fff8e1, #ffe9f3);
            border-left: 5px solid #ff7eb3;
            border-radius: 8px;
        }
        .child-row.bday-today {
            background: linear-gradient(90deg, #ffe0f0, #fff3c4, #e0f4ff);
            border: 2px solid #ff4fa3;
            border-radius: 8px;
            animation: bdayPulse 1.8s ease-in-out infinite;
        }
        @keyframes bdayPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,79,163,.35); }
            50% { box-shadow: 0 0 14px 4px rgba(255,79,163,.35); }
        }
        .child-img.bday-ring { border: 3px solid #ff4fa3; box-shadow: 0 0 8px rgba(255,79,163,.6); }
        .bday-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 15px;
            font-weight: bold;
            background: #ff4fa3;
            color: white;
        }
        .bday-badge.soon { background: #ffb347; color: #5a3a00; }
        #bdayBanner {
            display: none;
            margin-bottom: 15px;
            padding: 14px 16px;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff9ec7, #ffd86b);
            color: #4a1030;
            font-weight: bold;
            font-size: 19px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 32px;
            cursor: pointer;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 17px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 17px; }
        .dob-row { display: flex; gap: 8px; }
        .dob-row select { flex: 1; min-width: 0; }
        .dob-row select.dob-year { flex: 1.2; }
        .hidden { display: none !important; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 17px; }
        .info-table td { padding: 8px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
        .info-table td:first-child { font-weight: bold; color: #555; width: 40%; }
        #groupList li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 17px; }
        #groupList .btn-delete { width: 30px; height: 30px; font-size: 14px; }

        /* Payments list modal */
        .payments-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .payments-filters select {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 17px;
        }
        #paymentsList {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 420px;
            overflow-y: auto;
        }
        #paymentsList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 17px;
        }
        .payment-name {
            font-weight: bold;
        }
        .payment-group {
            color: #999;
            font-size: 15px;
            font-weight: normal;
        }
        .payment-date-badge {
            color: #28a745;
            font-weight: bold;
            white-space: nowrap;
        }
        .payment-date-badge.unpaid-badge {
            color: #dc3545;
        }
        #paymentsCount {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        #historyModal ul { font-size: 17px; }
    </style>
</head>
<body>

<header>
    <h1>BALLET</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;"><a class="btn btn-save" href="cash.html" style="text-decoration:none;">💰 Դրամարկղ</a><button class="btn btn-close-month" id="closeMonthBtn">Փակել Ամիսը</button></div>
</header>

<div class="main-container">
    <div class="sidebar">
        <h3>Ֆիլտրեր</h3>
        <button class="filter-btn active" data-filter="all">Բոլորը</button>
        <button class="filter-btn" data-filter="unassigned">Չնշանակված</button>
        <button class="filter-btn" data-filter="birthday">🎂 Ծննդյան օրեր (<span id="bdayCount">0</span>)</button>
        <div id="groupFilters"></div>
        <hr class="sidebar-divider">
        <button class="filter-btn btn-payments-list" id="openPaymentsModalBtn">✅ Վճարածների Ցուցակ</button>
    </div>

    <div class="content">
        <div class="content-header">
            <h2>Երեխաների Ցուցակ (<span id="childCount">0</span>)</h2>
            <div class="content-header-actions">
                <button class="btn btn-group" id="openGroupModalBtn">+ Նոր Խումբ</button>
                <button class="btn btn-add" id="openAddModalBtn">+ Ավելացնել Երեխա</button>
            </div>
        </div>
        <div id="bdayBanner"></div>
        <div id="childrenList">
        </div>
    </div>
</div>

<div class="modal hidden" id="addModal">
    <div class="modal-content">
        <span class="close-modal" id="closeAddModalBtn">&times;</span>
        <h3>Ավելացնել Նոր Երեխա</h3>
        <form id="registrationForm">
            <div class="form-group"><label>Երեխայի Անուն *</label><input type="text" id="childName" required placeholder="Անուն"></div>
            <div class="form-group"><label>Երեխայի Ազգանուն *</label><input type="text" id="childSurname" required placeholder="Ազգանուն"></div>

            <div class="form-group">
                <label>Ծննդյան Ամսաթիվ *</label>
                <div class="dob-row">
                    <select id="childDobDay" required></select>
                    <select id="childDobMonth" required></select>
                    <select id="childDobYear" class="dob-year" required></select>
                </div>
            </div>

            <div class="form-group"><label>Ծնողի Անուն Ազգանուն *</label><input type="text" id="parentName" required placeholder="Անուն Ազգանուն"></div>
            <div class="form-group"><label>Հեռախոսահամար *</label><input type="tel" id="phone" required placeholder="+374 XXXXXXXX"></div>
            <div class="form-group"><label>Հեռախոսահամար 2</label><input type="tel" id="phone2" placeholder="+374 XXXXXXXX"></div>
            <div class="form-group"><label>Հասցե *</label><input type="text" id="address" required placeholder="Հասցե"></div>

            <div class="form-group">
                <label>Խումբ</label>
                <select id="addGroup">
                    <option value="">-- Չնշանակված --</option>
                </select>
            </div>

            <div class="form-group"><label>Կցել Նկար (պարտադիր չէ)</label><input type="file" id="photoFile" accept="image/*"></div>
            <button type="submit" class="btn btn-add" id="submitBtn">Պահպանել Բազայում</button>
        </form>
    </div>
</div>

<div class="modal hidden" id="historyModal">
    <div class="modal-content" style="max-width: 700px;">
        <span class="close-modal" id="closeHistoryModalBtn">&times;</span>
        <h3 id="historyModalTitle">Հաճախումների և Վճարների Պատմություն</h3>
        <div style="display: flex; gap: 20px; margin-top: 15px;">
            <div style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px;">
                <h4>🗓 Օրեր (Ներկա/Բացակա)</h4>
                <ul id="modalAttendanceList" style="padding-left: 20px; margin: 0;"></ul>
            </div>
            <div style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px;">
                <h4>💰 Վճարումներ</h4>
                <ul id="modalPaymentList" style="padding-left: 20px; margin: 0;"></ul>
            </div>
        </div>
    </div>
</div>

<div class="modal hidden" id="infoModal">
    <div class="modal-content" style="max-width: 560px;">
        <span class="close-modal" id="closeInfoModalBtn">&times;</span>
        <h3 id="infoModalTitle">Ծնողի Գրանցած Տվյալները</h3>
        <table class="info-table" id="infoModalTable"></table>
    </div>
</div>

<div class="modal hidden" id="groupModal">
    <div class="modal-content" style="max-width: 520px;">
        <span class="close-modal" id="closeGroupModalBtn">&times;</span>
        <h3>Խմբերի Կառավարում</h3>
        <div class="form-group">
            <label>Նոր Խմբի Անվանում</label>
            <input type="text" id="newGroupLabel" placeholder="Օր. Արտաշատ - Ակրոբատիկա - 15:00">
        </div>
        <div class="form-group">
            <label>Ամսական Վարձ (֏) *</label>
            <input type="number" id="newGroupPrice" placeholder="Օր. 15000" min="1" step="any">
        </div>
        <button class="btn btn-add" id="addGroupBtn" style="width:100%;">+ Ավելացնել Խումբ</button>
        <hr>
        <h4>Առկա Խմբեր</h4>
        <ul id="groupList" style="list-style:none; padding:0; margin:0;"></ul>
    </div>
</div>

<div class="modal hidden" id="paymentsModal">
    <div class="modal-content" style="max-width: 720px;">
        <span class="close-modal" id="closePaymentsModalBtn">&times;</span>
        <h3>✅ Վճարումների Ցուցակ</h3>
        <div class="payments-filters">
            <select id="paymentsGroupFilter">
                <option value="all">Բոլոր Խմբերը</option>
            </select>
            <select id="paymentsMonthFilter">
                <option value="all">Բոլոր Ամիսները</option>
            </select>
            <select id="paymentsStatusFilter">
                <option value="all">Բոլորը</option>
                <option value="paid">Միայն Վճարած</option>
                <option value="unpaid">Միայն Չվճարած</option>
            </select>
        </div>
        <div id="paymentsCount"></div>
        <ul id="paymentsList"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const firebaseConfig = {
        apiKey: "AIzaSyDgyGEMIJfrT_N-U-a-39_U7N5JKfsLrvg",
        authDomain: "ballet-82dcb.firebaseapp.com",
        projectId: "ballet-82dcb",
        storageBucket: "ballet-82dcb.firebasestorage.app",
        messagingSenderId: "1020750431146",
        appId: "1:1020750431146:web:e2880c0d6a26a9ba3a21d3",
        measurementId: "G-N0W4X2ZLKJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Եթե օգտատերը լոգին եղած չէ, նրան հետ է ուղարկում մուտքի էջ (index.html)
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html";
        }
    });

    const CLOUDINARY_CLOUD_NAME = "xvaxriwv";
    const CLOUDINARY_UPLOAD_PRESET = "ballet";

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Նկարի բացակայության դեպքում ցուցադրվող լռելյայն պատկեր
    const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" fill="#e3e7ee"/><circle cx="30" cy="23" r="11" fill="#a9b2c3"/><path d="M8 60c0-14 10-22 22-22s22 8 22 22z" fill="#a9b2c3"/></svg>'
    );

    // --- Ծննդյան օր ---
    const BDAY_WINDOW = 7; // քանի օր առաջ սկսի ծննդյան դիզայնը
    function birthdayInfo(dob) {
        if (!dob) return null;
        const p = String(dob).split('-');
        if (p.length !== 3) return null;
        const y = +p[0], m = +p[1] - 1, d = +p[2];
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let next = new Date(today.getFullYear(), m, d);
        if (next < today) next = new Date(today.getFullYear() + 1, m, d);
        return { days: Math.round((next - today) / 86400000), age: next.getFullYear() - y };
    }

    let allStudents = [];
    let groupsCache = []; // { id, label }
    let currentFilter = "all";

    // Էլեմենտներ
    const childrenList = document.getElementById('childrenList');
    const childCountText = document.getElementById('childCount');
    const addModal = document.getElementById('addModal');
    const addGroupSelect = document.getElementById('addGroup');
    const groupFilters = document.getElementById('groupFilters');
    const groupModal = document.getElementById('groupModal');
    const groupList = document.getElementById('groupList');
    const paymentsModal = document.getElementById('paymentsModal');
    const paymentsGroupFilter = document.getElementById('paymentsGroupFilter');
    const paymentsMonthFilter = document.getElementById('paymentsMonthFilter');
    const paymentsStatusFilter = document.getElementById('paymentsStatusFilter');
    const paymentsList = document.getElementById('paymentsList');
    const paymentsCount = document.getElementById('paymentsCount');

    const MONTH_NAMES_HY = ['Հունվար','Փետրվար','Մարտ','Ապրիլ','Մայիս','Հունիս','Հուլիս','Օգոստոս','Սեպտեմբեր','Հոկտեմբեր','Նոյեմբեր','Դեկտեմբեր'];

    // --- Ծննդյան ամսաթվի ընտրություն (Օր / Ամիս / Տարի) ---
    const dobDay = document.getElementById('childDobDay');
    const dobMonth = document.getElementById('childDobMonth');
    const dobYear = document.getElementById('childDobYear');

    function populateDobSelects() {
        dobDay.innerHTML = '<option value="">Օր</option>';
        for (let d = 1; d <= 31; d++) {
            dobDay.innerHTML += `<option value="${d}">${d}</option>`;
        }
        dobMonth.innerHTML = '<option value="">Ամիս</option>';
        MONTH_NAMES_HY.forEach((name, i) => {
            dobMonth.innerHTML += `<option value="${i + 1}">${name}</option>`;
        });
        dobYear.innerHTML = '<option value="">Տարի</option>';
        const thisYear = new Date().getFullYear();
        for (let y = thisYear; y >= thisYear - 30; y--) {
            dobYear.innerHTML += `<option value="${y}">${y}</option>`;
        }
    }

    // Վերադարձնում է "yyyy-mm-dd" կամ null, եթե ամսաթիվը անվավեր է (օր. 31 Փետրվար)
    function getDobValue() {
        const d = +dobDay.value, m = +dobMonth.value, y = +dobYear.value;
        if (!d || !m || !y) return null;
        const test = new Date(y, m - 1, d);
        if (test.getFullYear() !== y || test.getMonth() !== m - 1 || test.getDate() !== d) return null;
        return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    // --- Նկարի սեղմման/փոքրացման ֆունկցիա (Client-side resize) ---
    function resizeImage(file, maxSize = 1000, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const reader = new FileReader();

            reader.onload = (e) => {
                img.src = e.target.result;
            };
            reader.onerror = reject;

            img.onload = () => {
                let { width, height } = img;

                if (width > height) {
                    if (width > maxSize) {
                        height = Math.round(height * (maxSize / width));
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width = Math.round(width * (maxSize / height));
                        height = maxSize;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error("Նկարը հնարավոր չեղավ սեղմել"));
                        return;
                    }
                    resolve(blob);
                }, 'image/jpeg', quality);
            };

            img.onerror = () => reject(new Error("Նկարը հնարավոր չեղավ բացել"));

            reader.readAsDataURL(file);
        });
    }

    // --- Խմբեր (groups / class-times) ---
    async function loadGroups() {
        const querySnapshot = await getDocs(collection(db, "groups"));
        groupsCache = [];
        querySnapshot.forEach((d) => {
            groupsCache.push({ id: d.id, ...d.data() });
        });
        groupsCache.sort((a, b) => (a.label || '').localeCompare(b.label || '', 'hy'));
        renderSidebarFilters();
        populateAddGroupSelect();
    }

    function renderSidebarFilters() {
        groupFilters.innerHTML = '';
        groupsCache.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn' + (currentFilter === g.id ? ' active' : '');
            btn.setAttribute('data-filter', g.id);
            btn.textContent = g.label;
            groupFilters.appendChild(btn);
        });
    }

    function populateAddGroupSelect() {
        addGroupSelect.innerHTML = '<option value="">-- Չնշանակված --</option>';
        groupsCache.forEach(g => {
            const o = document.createElement('option');
            o.value = g.id;
            o.textContent = g.label;
            addGroupSelect.appendChild(o);
        });
    }

    function renderGroupList() {
        groupList.innerHTML = '';
        if (groupsCache.length === 0) {
            groupList.innerHTML = "<li style='color:#777; border:none;'>Խմբեր դեռ չկան</li>";
            return;
        }
        groupsCache.forEach(g => {
            const li = document.createElement('li');
            const span = document.createElement('span');
            span.textContent = g.label + ' — ' + (g.price > 0 ? Number(g.price).toLocaleString('en-US') + ' ֏' : 'վարձ չկա');
            const delBtn = document.createElement('button');
            delBtn.className = 'btn btn-delete';
            delBtn.textContent = 'X';
            delBtn.addEventListener('click', async () => {
                if (confirm(`Ջնջե՞լ "${g.label}" խումբը:`)) {
                    await deleteDoc(doc(db, "groups", g.id));
                    await loadGroups();
                    renderGroupList();
                    renderList();
                }
            });
            const editBtn = document.createElement('button');
            editBtn.className = 'btn btn-save';
            editBtn.style.cssText = 'padding:6px 10px;font-size:15px;margin-right:6px;';
            editBtn.textContent = '✎ Վարձ';
            editBtn.addEventListener('click', async () => {
                const v = prompt(`"${g.label}" խմբի նոր ամսական վարձը (֏):`, g.price || '');
                if (v === null) return;
                const n = Number(v);
                if (!(n > 0)) { alert('Մուտքագրեք 0-ից մեծ թիվ'); return; }
                await updateDoc(doc(db, "groups", g.id), { price: n });
                await loadGroups();
                renderGroupList();
            });
            const box = document.createElement('div');
            box.style.cssText = 'display:flex;align-items:center;';
            box.appendChild(editBtn);
            box.appendChild(delBtn);
            li.appendChild(span);
            li.appendChild(box);
            groupList.appendChild(li);
        });
    }

    document.getElementById('openGroupModalBtn').addEventListener('click', () => {
        renderGroupList();
        groupModal.classList.remove('hidden');
    });
    document.getElementById('closeGroupModalBtn').addEventListener('click', () => groupModal.classList.add('hidden'));

    document.getElementById('addGroupBtn').addEventListener('click', async () => {
        const input = document.getElementById('newGroupLabel');
        const label = input.value.trim();
        if (!label) {
            alert('Գրեք խմբի անվանումը');
            return;
        }
        const price = Number(document.getElementById('newGroupPrice').value);
        if (!(price > 0)) {
            alert('Նշեք խմբի ամսական վարձը (0-ից մեծ)');
            return;
        }
        await addDoc(collection(db, "groups"), { label, price, createdAt: new Date() });
        input.value = '';
        document.getElementById('newGroupPrice').value = '';
        await loadGroups();
        renderGroupList();
    });

    // Բեռնել տվյալները Firestore-ից
    async function loadData() {
        childrenList.innerHTML = "Բեռնվում է...";
        allStudents = [];
        const querySnapshot = await getDocs(collection(db, "registrations"));
        querySnapshot.forEach((doc) => {
            allStudents.push({ id: doc.id, ...doc.data() });
        });
        renderList();
    }

    // Ցուցակի արտածում ըստ ֆիլտրի
    function renderList() {
        childrenList.innerHTML = "";
        let filtered = allStudents.filter(student => {
            if (currentFilter === "all") return true;
            if (currentFilter === "unassigned") return !student.groupId;
            if (currentFilter === "birthday") {
                const b = birthdayInfo(student.childDob);
                return b && b.days <= BDAY_WINDOW;
            }
            return student.groupId === currentFilter;
        });
        if (currentFilter === "birthday") {
            filtered.sort((a, b) => birthdayInfo(a.childDob).days - birthdayInfo(b.childDob).days);
        }

        // Ծննդյան հաշվիչ + վերնագիր
        const bdayAll = allStudents.filter(s => { const b = birthdayInfo(s.childDob); return b && b.days <= BDAY_WINDOW; });
        document.getElementById('bdayCount').textContent = bdayAll.length;
        const todayNames = allStudents.filter(s => { const b = birthdayInfo(s.childDob); return b && b.days === 0; })
            .map(s => `${esc(s.childName)} ${esc(s.childSurname)}`);
        const banner = document.getElementById('bdayBanner');
        banner.style.display = todayNames.length ? 'block' : 'none';
        banner.innerHTML = todayNames.length ? `🎉 Այսօր ծննդյան օր ունի՝ ${todayNames.join(', ')} 🎂` : '';

        childCountText.textContent = filtered.length;

        filtered.forEach(student => {
            const isPaid = student.isPaid || false;
            const attendanceHistory = student.attendance || [];
            const paymentHistory = student.payments || [];
            const groupLabel = student.groupLabel || '';

            const row = document.createElement('div');
            const bd = birthdayInfo(student.childDob);
            const bdToday = bd && bd.days === 0;
            const bdSoon = bd && bd.days > 0 && bd.days <= BDAY_WINDOW;
            row.className = 'child-row' + (bdToday ? ' bday-today' : bdSoon ? ' bday-soon' : '');
            let bdBadge = '';
            if (bdToday) bdBadge = `<span class="bday-badge">🎂 Այսօր ${bd.age} տարեկան է! 🎉</span>`;
            else if (bdSoon) bdBadge = `<span class="bday-badge soon">🎈 Ծննդյան օր՝ ${bd.days === 1 ? 'վաղը' : bd.days + ' օրից'} (${bd.age} տարեկան)</span>`;
            row.innerHTML = `
                <div class="child-info">
                    <img src="${student.photoUrl ? esc(student.photoUrl) : DEFAULT_AVATAR}" class="child-img ${bd && bd.days <= BDAY_WINDOW ? 'bday-ring' : ''}" loading="lazy">
                    <div>
                        <div class="child-name">${esc(student.childName)} ${esc(student.childSurname)}</div>
                        <div id="meta-${student.id}" class="child-meta">
                            ${esc(groupLabel) || 'Խումբը դեռ նշանակված չէ'}
                        </div>
                        ${bdBadge}
                    </div>
                </div>
                <div class="controls">
                    <div class="assign-group">
                        <select id="assign-${student.id}">
                            <option value="">-- Խումբ --</option>
                            ${groupsCache.map(g => `<option value="${g.id}" ${student.groupId === g.id ? 'selected' : ''}>${esc(g.label)}</option>`).join('')}
                        </select>
                    </div>

                    <select id="pay-${student.id}" class="pay-select ${isPaid ? 'paid' : 'unpaid'}">
                        <option value="false" ${!isPaid ? 'selected' : ''}>Չվճարված</option>
                        <option value="true" ${isPaid ? 'selected' : ''}>Վճարված</option>
                    </select>

                    <select id="att-${student.id}">
                        <option value="">-- Հաճախում --</option>
                        <option value="ներկա">Ներկա</option>
                        <option value="բացակա">Բացակա</option>
                    </select>

                    <button class="btn btn-info" id="info-${student.id}">Տվյալներ</button>
                    <button class="btn" style="background: #6c757d; color: white;" id="hist-${student.id}">Պատմություն</button>

                    <div class="history-text">
                        Վճարներ: ${paymentHistory.join(', ') || 'Չկա'}<br>
                        Օրեր: ${attendanceHistory.join(', ') || 'Չկա'}
                    </div>

                    <button class="btn btn-save" id="save-${student.id}">Պահպանել</button>
                    <button class="btn btn-delete" id="del-${student.id}">X</button>
                </div>
            `;
            childrenList.appendChild(row);

            // Վճարման select-ի գույնը փոխվում է անմիջապես ընտրության պահին
            const paySelectEl = document.getElementById(`pay-${student.id}`);
            paySelectEl.addEventListener('change', () => {
                const nowPaid = paySelectEl.value === "true";
                paySelectEl.classList.toggle('paid', nowPaid);
                paySelectEl.classList.toggle('unpaid', !nowPaid);
            });

            // Ինֆո Կոճակ` ցույց է տալիս ծնողի գրանցած ԲՈԼՈՐ տվյալները
            document.getElementById(`info-${student.id}`).addEventListener('click', () => {
                const infoModal = document.getElementById('infoModal');
                document.getElementById('infoModalTitle').textContent = `${student.childName} ${student.childSurname} - Տվյալներ`;
                const table = document.getElementById('infoModalTable');
                const createdAtText = student.createdAt ? new Date(student.createdAt.seconds * 1000).toLocaleDateString() : '—';
                const rows = [
                    ['Երեխայի անուն', student.childName || '—'],
                    ['Երեխայի ազգանուն', student.childSurname || '—'],
                    ['Ծննդյան օր', student.childDob || '—'],
                    ['Ծնողի անուն ազգանուն', student.parentName || '—'],
                    ['Հեռախոս 1', student.phone || '—'],
                    ['Հեռախոս 2', student.phone2 || '—'],
                    ['Հասցե', student.address || '—'],
                    ['Խումբ', student.groupLabel || 'Դեռ նշանակված չէ'],
                    ['Գրանցվել է', createdAtText]
                ];
                table.innerHTML = rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('');
                infoModal.classList.remove('hidden');
            });

            // Պատմություն Կոճակ
            document.getElementById(`hist-${student.id}`).addEventListener('click', () => {
                const hModal = document.getElementById('historyModal');
                document.getElementById('historyModalTitle').textContent = `${student.childName} ${student.childSurname} - Պատմություն`;

                const attUl = document.getElementById('modalAttendanceList');
                const payUl = document.getElementById('modalPaymentList');

                attUl.innerHTML = "";
                payUl.innerHTML = "";

                if(attendanceHistory.length === 0) {
                    attUl.innerHTML = "<li style='color:#777;'>Չկա</li>";
                } else {
                    attendanceHistory.forEach(day => {
                        let li = document.createElement('li');
                        li.textContent = day;
                        li.style.color = day.includes("ներկա") ? "#007bff" : "#ffc107";
                        li.style.fontWeight = "bold";
                        attUl.appendChild(li);
                    });
                }

                if(paymentHistory.length === 0) {
                    payUl.innerHTML = "<li style='color:#777;'>Չկա</li>";
                } else {
                    paymentHistory.forEach(pay => {
                        let li = document.createElement('li');
                        li.textContent = `✅ ${pay}`;
                        li.style.color = "#28a745";
                        li.style.fontWeight = "bold";
                        payUl.appendChild(li);
                    });
                }

                hModal.classList.remove('hidden');
            });

            // Պահպանել տվյալ երեխայի կարգավիճակը (խումբ + վճար + հաճախում)
            document.getElementById(`save-${student.id}`).addEventListener('click', async (e) => {
                const btnSave = e.target;
                btnSave.disabled = true;
                const oldText = btnSave.textContent;
                btnSave.textContent = "...";

                const payStatus = document.getElementById(`pay-${student.id}`).value === "true";
                const attStatus = document.getElementById(`att-${student.id}`).value;
                const today = new Date().toLocaleDateString('hy-AM');

                const assignSelect = document.getElementById(`assign-${student.id}`);
                const newGroupId = assignSelect.value || null;
                const newGroupObj = groupsCache.find(g => g.id === newGroupId);
                const newGroupLabel = newGroupObj ? newGroupObj.label : '';

                let updatedAttendance = [...(student.attendance || [])];
                let updatedPayments = [...(student.payments || [])];

                if (attStatus) {
                    updatedAttendance.push(`${today} (${attStatus})`);
                }
                const wasPaid = !!student.isPaid;
                if (payStatus && !wasPaid) {
                    updatedPayments.push(today);
                }

                try {
                    const docRef = doc(db, "registrations", student.id);
                    await updateDoc(docRef, {
                        isPaid: payStatus,
                        attendance: updatedAttendance,
                        payments: updatedPayments,
                        groupId: newGroupId,
                        groupLabel: newGroupLabel
                    });

                    // Վճարում → դրամարկղ (խմբի վարձի չափով)
                    if (payStatus && !wasPaid) {
                        const grp = groupsCache.find(g => g.id === newGroupId);
                        if (grp && grp.price > 0) {
                            const d = new Date();
                            const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                            await addDoc(collection(db, "cash"), {
                                type: 'tuition',
                                title: `${student.childName} ${student.childSurname} (${grp.label})`,
                                amount: grp.price,
                                studentId: student.id,
                                groupId: grp.id,
                                groupLabel: grp.label,
                                date: iso,
                                monthKey: iso.slice(0, 7),
                                createdAt: new Date()
                            });
                        } else {
                            alert("Ուշադրություն: երեխան խումբ չունի կամ խմբի վարձը նշված չէ, գումարը դրամարկղում ՉԻ գրանցվել:");
                        }
                    }

                    // ԼՈԿԱԼ ԹԱՐՄԱՑՈՒՄ
                    student.isPaid = payStatus;
                    student.attendance = updatedAttendance;
                    student.payments = updatedPayments;
                    student.groupId = newGroupId;
                    student.groupLabel = newGroupLabel;

                    // Թարմացնում ենք .history-text դիվի պարունակությունը
                    const row = btnSave.closest('.child-row');
                    if (row) {
                        const historyDiv = row.querySelector('.history-text');
                        if (historyDiv) {
                            historyDiv.innerHTML = `
                                Վճարներ: ${updatedPayments.join(', ') || 'Չկա'}<br>
                                Օրեր: ${updatedAttendance.join(', ') || 'Չկա'}
                            `;
                        }
                        const metaDiv = document.getElementById(`meta-${student.id}`);
                        if (metaDiv) {
                            metaDiv.textContent = newGroupLabel || 'Խումբը դեռ նշանակված չէ';
                        }
                    }

                    // Ապահովում ենք որ վճարման select-ի գույնը ճիշտ է պահպանումից հետո
                    paySelectEl.classList.toggle('paid', payStatus);
                    paySelectEl.classList.toggle('unpaid', !payStatus);

                    // Մաքրում ենք հաճախման select-ը
                    document.getElementById(`att-${student.id}`).value = "";
                    alert("Պահպանվեց:");
                } catch (err) {
                    alert("Սխալ պահպանելիս: " + err.message);
                } finally {
                    btnSave.disabled = false;
                    btnSave.textContent = oldText;
                }
            });

            // Ջնջել Բազայից
            document.getElementById(`del-${student.id}`).addEventListener('click', async () => {
                if (confirm(`Վստա՞հ եք, որ ուզում եք ջնջել ${student.childName}-ին բազայից:`)) {
                    await deleteDoc(doc(db, "registrations", student.id));
                    loadData();
                }
            });
        });
    }

    // Ֆիլտրերի սեղմման իրադարձություն (delegation, քանի որ խմբային ֆիլտրերը դինամիկ են)
    document.querySelector('.sidebar').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn || btn.id === 'openPaymentsModalBtn') return;
        document.querySelectorAll('.filter-btn').forEach(b => {
            if (b.id !== 'openPaymentsModalBtn') b.classList.remove('active');
        });
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderList();
    });

    // Փակել Ամիսը (Բոլորին սարքում է Չվճարված)
    document.getElementById('closeMonthBtn').addEventListener('click', async () => {
        if (confirm("Վստա՞հ եք, որ ուզում եք փակել ամիսը: Բոլոր հաճախորդների կարգավիճակը կդառնա ՉՎՃԱՐՎԱԾ:")) {
            for (let student of allStudents) {
                if (student.isPaid) {
                    await updateDoc(doc(db, "registrations", student.id), { isPaid: false });
                }
            }
            alert("Ամիսը փակված է:");
            loadData();
        }
    });

    // Մոդալի բացել/փակելը
    document.getElementById('openAddModalBtn').addEventListener('click', () => {
        populateAddGroupSelect();
        addModal.classList.remove('hidden');
    });
    document.getElementById('closeAddModalBtn').addEventListener('click', () => addModal.classList.add('hidden'));
    document.getElementById('closeHistoryModalBtn').addEventListener('click', () => document.getElementById('historyModal').classList.add('hidden'));
    document.getElementById('closeInfoModalBtn').addEventListener('click', () => document.getElementById('infoModal').classList.add('hidden'));

    // --- Վճարումների Ցուցակ (վճարած + չվճարած, ըստ ամսվա և խմբի) ---

    // Ամսաթվի string-ից (dd.mm.yyyy, ինչպես toLocaleDateString('hy-AM') է տալիս) ստանում ենք "yyyy-mm" բանալի
    function getMonthKeyFromDateStr(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.trim().split('.');
        if (parts.length !== 3) return null;
        const [d, m, y] = parts;
        if (!y || !m) return null;
        return `${y}-${m.padStart(2, '0')}`;
    }

    function monthKeyToLabel(key) {
        const [year, month] = key.split('-');
        const idx = parseInt(month, 10) - 1;
        const name = MONTH_NAMES_HY[idx] || month;
        return `${name} ${year}`;
    }

    // Հավաքում ենք բոլոր վճարումները՝ յուրաքանչյուր վճարման օրվա համար մեկ առանձին տող (✅ Վճարած)
    function getPaidEntries() {
        const entries = [];
        allStudents.forEach(student => {
            const payments = student.payments || [];
            payments.forEach(dateStr => {
                entries.push({
                    isPaid: true,
                    name: `${student.childName || ''} ${student.childSurname || ''}`.trim(),
                    date: dateStr,
                    monthKey: getMonthKeyFromDateStr(dateStr),
                    groupId: student.groupId || '',
                    groupLabel: student.groupLabel || 'Առանց խմբի'
                });
            });
        });
        return entries;
    }

    // Ընթացիկ ամսում ՉՎՃԱՐԱԾ երեխաների ցուցակ (isPaid === false)
    function getUnpaidEntries() {
        const entries = [];
        allStudents.forEach(student => {
            if (!student.isPaid) {
                entries.push({
                    isPaid: false,
                    name: `${student.childName || ''} ${student.childSurname || ''}`.trim(),
                    date: null,
                    monthKey: null,
                    groupId: student.groupId || '',
                    groupLabel: student.groupLabel || 'Առանց խմբի'
                });
            }
        });
        return entries;
    }

    function populatePaymentsFilters() {
        // Խմբերի ֆիլտր
        paymentsGroupFilter.innerHTML = '<option value="all">Բոլոր Խմբերը</option>';
        groupsCache.forEach(g => {
            const o = document.createElement('option');
            o.value = g.id;
            o.textContent = g.label;
            paymentsGroupFilter.appendChild(o);
        });

        // Ամիսների ֆիլտր (միայն այն ամիսները, որտեղ իրական վճարումներ կան)
        const paidEntries = getPaidEntries();
        const monthKeys = [...new Set(paidEntries.map(e => e.monthKey).filter(Boolean))];
        monthKeys.sort().reverse();

        paymentsMonthFilter.innerHTML = '<option value="all">Բոլոր Ամիսները</option>';
        monthKeys.forEach(key => {
            const o = document.createElement('option');
            o.value = key;
            o.textContent = monthKeyToLabel(key);
            paymentsMonthFilter.appendChild(o);
        });
    }

    function renderPaymentsList() {
        const groupVal = paymentsGroupFilter.value;
        const monthVal = paymentsMonthFilter.value;
        const statusVal = paymentsStatusFilter.value;

        let paidEntries = getPaidEntries();
        let unpaidEntries = getUnpaidEntries();

        if (groupVal !== 'all') {
            paidEntries = paidEntries.filter(e => e.groupId === groupVal);
            unpaidEntries = unpaidEntries.filter(e => e.groupId === groupVal);
        }
        if (monthVal !== 'all') {
            // Չվճարածներն ամսաթիվ չունեն, ուստի ցուցադրվում են միայն "Բոլոր Ամիսները" ընտրության դեպքում
            paidEntries = paidEntries.filter(e => e.monthKey === monthVal);
            unpaidEntries = [];
        }
        if (statusVal === 'paid') {
            unpaidEntries = [];
        }
        if (statusVal === 'unpaid') {
            paidEntries = [];
        }

        // Դասավորում ենք վճարածները ամսաթվով՝ ամենավերջինը վերևում
        paidEntries.sort((a, b) => {
            const da = (a.date || '').split('.').reverse().join('-');
            const db_ = (b.date || '').split('.').reverse().join('-');
            return db_.localeCompare(da);
        });
        // Չվճարածները դասավորում ենք անունով
        unpaidEntries.sort((a, b) => a.name.localeCompare(b.name, 'hy'));

        // Չվճարածները ցուցադրում ենք առաջինը (ուշադրություն են պահանջում), ապա՝ վճարածները
        const entries = [...unpaidEntries, ...paidEntries];

        paymentsCount.textContent = `Ընդամենը՝ ${entries.length} (✅ Վճարած՝ ${paidEntries.length}, ❌ Չվճարած՝ ${unpaidEntries.length})`;
        paymentsList.innerHTML = '';

        if (entries.length === 0) {
            paymentsList.innerHTML = "<li style='color:#777; justify-content:center;'>Տվյալներ չեն գտնվել</li>";
            return;
        }

        entries.forEach(e => {
            const li = document.createElement('li');
            const badge = e.isPaid
                ? `<span class="payment-date-badge">✅ ${e.date}</span>`
                : `<span class="payment-date-badge unpaid-badge">❌ Չվճարված</span>`;
            li.innerHTML = `
                <span class="payment-name">${esc(e.name)} <span class="payment-group">(${esc(e.groupLabel)})</span></span>
                ${badge}
            `;
            paymentsList.appendChild(li);
        });
    }

    document.getElementById('openPaymentsModalBtn').addEventListener('click', () => {
        populatePaymentsFilters();
        renderPaymentsList();
        paymentsModal.classList.remove('hidden');
    });
    document.getElementById('closePaymentsModalBtn').addEventListener('click', () => paymentsModal.classList.add('hidden'));
    paymentsGroupFilter.addEventListener('change', renderPaymentsList);
    paymentsMonthFilter.addEventListener('change', renderPaymentsList);
    paymentsStatusFilter.addEventListener('change', renderPaymentsList);

    // Նոր երեխայի գրանցում մոդալից (Cloudinary + Firestore). Նկարը պարտադիր չէ։
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const dobValue = getDobValue();
        if (!dobValue) {
            alert("Ընտրեք ծննդյան ճիշտ ամսաթիվ (օր, ամիս, տարի):");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Բեռնվում է...";

        const file = document.getElementById('photoFile').files[0];
        try {
            let photoUrl = "";
            if (file) {
                submitBtn.textContent = "Նկարը մշակվում է...";
                const resizedBlob = await resizeImage(file, 1000, 0.8);

                submitBtn.textContent = "Բեռնվում է...";
                const cloudinaryData = new FormData();
                cloudinaryData.append("file", resizedBlob, "photo.jpg");
                cloudinaryData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: cloudinaryData });
                if (!res.ok) throw new Error("Նկարը հնարավոր չեղավ բեռնել Cloudinary");
                const data = await res.json();
                photoUrl = data.secure_url.replace("/upload/", "/upload/f_webp,q_auto/");
            }

            const selectedGroupId = addGroupSelect.value || null;
            const selectedGroupObj = groupsCache.find(g => g.id === selectedGroupId);
            const selectedGroupLabel = selectedGroupObj ? selectedGroupObj.label : '';

            const formData = {
                childName: document.getElementById('childName').value,
                childSurname: document.getElementById('childSurname').value,
                childDob: dobValue,
                parentName: document.getElementById('parentName').value,
                phone: document.getElementById('phone').value,
                phone2: document.getElementById('phone2').value,
                address: document.getElementById('address').value,
                groupId: selectedGroupId,
                groupLabel: selectedGroupLabel,
                photoUrl: photoUrl,
                isPaid: false,
                attendance: [],
                payments: [],
                createdAt: new Date()
            };

            await addDoc(collection(db, "registrations"), formData);
            alert("Երեխան հաջողությամբ ավելացվեց բազա:");
            addModal.classList.add('hidden');
            document.getElementById('registrationForm').reset();
            loadData();
        } catch (err) {
            alert("Սխալ: " + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Պահպանել Բազայում";
        }
    });

    // Առաջին բեռնումը
    async function init() {
        populateDobSelects();
        await loadGroups();
        await loadData();
    }
    init();
</script>
