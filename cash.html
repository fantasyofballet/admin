<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLET - Դրամարկղ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 15px; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        h1 { margin: 0; letter-spacing: 2px; }
        h3 { margin-top: 0; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-back { background: #6c757d; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-del { background: #bd2130; color: white; border-radius: 50%; width: 26px; height: 26px; padding: 0; font-size: 12px; }
        .card { background: white; padding: 18px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        select, input { padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .toolbar select { min-width: 220px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid #ccc; }
        .stat span { color: #777; font-size: 13px; }
        .stat b { display: block; font-size: 22px; margin-top: 6px; }
        .stat.tuition { border-top-color: #28a745; }
        .stat.income { border-top-color: #17a2b8; }
        .stat.total { border-top-color: #007bff; }
        .stat.expense { border-top-color: #dc3545; }
        .stat.balance { border-top-color: #6610f2; }
        .pos { color: #28a745; } .neg { color: #dc3545; }
        .forms { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .forms { grid-template-columns: 1fr; } }
        .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .form-row input { flex: 1; min-width: 110px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 9px 6px; border-bottom: 1px solid #eee; text-align: left; }
        th { color: #555; background: #fafafa; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover { background: #f0f6ff; }
        tr.total-row td { font-weight: bold; background: #f4f6f9; }
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 7px 12px; border: 1px solid #ddd; background: #f8f9fa; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab.active { background: #007bff; color: white; border-color: #007bff; }
        .tag { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 99px; color: white; white-space: nowrap; }
        .tag.tuition { background: #28a745; } .tag.income { background: #17a2b8; } .tag.expense { background: #dc3545; }
        .empty { text-align: center; color: #888; padding: 20px; }
        .scroll { overflow-x: auto; }
    </style>
</head>
<body>

<header>
    <h1>BALLET — Դրամարկղ</h1>
    <a class="btn btn-back" href="admin.html">← Ադմին Վահանակ</a>
</header>

<div class="toolbar">
    <label for="periodSelect"><b>Ժամանակահատված՝</b></label>
    <select id="periodSelect"></select>
</div>

<div class="stats" id="stats"></div>

<div class="forms">
    <div class="card">
        <h3>➕ Կողմնակի Եկամուտ</h3>
        <form id="incomeForm">
            <div class="form-row">
                <input type="text" id="incTitle" placeholder="Աղբյուր (օր. Մրցույթ, հանդերձանք)" required maxlength="100">
                <input type="number" id="incAmount" placeholder="Գումար ֏" min="1" step="any" required>
                <input type="date" id="incDate" required>
            </div>
            <button class="btn btn-green" style="margin-top:10px;width:100%;" type="submit">Ավելացնել Եկամուտ</button>
        </form>
    </div>
    <div class="card">
        <h3>➖ Կողմնակի Ծախս</h3>
        <form id="expenseForm">
            <div class="form-row">
                <input type="text" id="expTitle" placeholder="Պատճառ (օր. Վարձ, կոստյում)" required maxlength="100">
                <input type="number" id="expAmount" placeholder="Գումար ֏" min="1" step="any" required>
                <input type="date" id="expDate" required>
            </div>
            <button class="btn btn-red" style="margin-top:10px;width:100%;" type="submit">Ավելացնել Ծախս</button>
        </form>
    </div>
</div>

<div class="card">
    <h3>👥 Ուսման Վճարներ ըստ Խմբերի <span id="periodLabel1" style="color:#777;font-weight:normal;"></span></h3>
    <div class="scroll"><table id="groupTable"></table></div>
</div>

<div class="card">
    <h3>🧾 Գործարքներ <span id="periodLabel2" style="color:#777;font-weight:normal;"></span></h3>
    <div class="tabs" id="tabs">
        <div class="tab active" data-type="all">Բոլորը</div>
        <div class="tab" data-type="tuition">Ուսման վճար</div>
        <div class="tab" data-type="income">Այլ եկամուտ</div>
        <div class="tab" data-type="expense">Ծախս</div>
    </div>
    <div class="scroll"><table id="txTable"></table></div>
</div>

<div class="card">
    <h3>📅 Ըստ Ամիսների (սեղմեք տողի վրա՝ ամիսը բացելու համար)</h3>
    <div class="scroll"><table id="monthTable"></table></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgyGEMIJfrT_N-U-a-39_U7N5JKfsLrvg",
        authDomain: "ballet-82dcb.firebaseapp.com",
        projectId: "ballet-82dcb",
        storageBucket: "ballet-82dcb.firebasestorage.app",
        messagingSenderId: "1020750431146",
        appId: "1:1020750431146:web:e2880c0d6a26a9ba3a21d3",
        measurementId: "G-N0W4X2ZLKJ"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
        else load();
    });

    const MONTHS = ['Հունվար','Փետրվար','Մարտ','Ապրիլ','Մայիս','Հունիս','Հուլիս','Օգոստոս','Սեպտեմբեր','Հոկտեմբեր','Նոյեմբեր','Դեկտեմբեր'];
    const TYPE_LABEL = { tuition: 'Ուսման վճար', income: 'Այլ եկամուտ', expense: 'Ծախս' };
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = n => Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ֏';
    const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const monthLabel = k => { const [y, m] = k.split('-'); return `${MONTHS[+m - 1]} ${y}`; };

    let all = [], period = 'all', typeFilter = 'all';

    $('incDate').value = todayISO();
    $('expDate').value = todayISO();

    async function load() {
        const snap = await getDocs(collection(db, 'cash'));
        all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    }

    function calc(list) {
        const r = { tuition: 0, income: 0, expense: 0 };
        list.forEach(x => { if (r[x.type] !== undefined) r[x.type] += Number(x.amount) || 0; });
        r.totalIn = r.tuition + r.income;
        r.balance = r.totalIn - r.expense;
        return r;
    }

    function render() {
        // Ամիսների ցանկ (+ ընթացիկ ամիսը միշտ)
        const cur = todayISO().slice(0, 7);
        const months = [...new Set([...all.map(x => x.monthKey).filter(Boolean), cur])].sort().reverse();
        if (period !== 'all' && !months.includes(period)) period = cur;

        $('periodSelect').innerHTML = `<option value="all">📊 Ամբողջական (բոլոր ամիսները)</option>` +
            months.map(m => `<option value="${m}" ${period === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('');
        $('periodSelect').value = period;

        const list = period === 'all' ? all : all.filter(x => x.monthKey === period);
        const label = period === 'all' ? '— ամբողջական' : '— ' + monthLabel(period);
        $('periodLabel1').textContent = label;
        $('periodLabel2').textContent = label;

        // Քարտեր
        const s = calc(list);
        $('stats').innerHTML = `
            <div class="stat tuition"><span>Ուսման վճարներ</span><b class="pos">${fmt(s.tuition)}</b></div>
            <div class="stat income"><span>Կողմնակի եկամուտ</span><b>${fmt(s.income)}</b></div>
            <div class="stat total"><span>Ընդհանուր եկամուտ</span><b>${fmt(s.totalIn)}</b></div>
            <div class="stat expense"><span>Ծախս</span><b class="neg">${fmt(s.expense)}</b></div>
            <div class="stat balance"><span>Մաքուր մնացորդ</span><b class="${s.balance >= 0 ? 'pos' : 'neg'}">${fmt(s.balance)}</b></div>`;

        // Խմբերի աղյուսակ
        const groups = {};
        list.filter(x => x.type === 'tuition').forEach(x => {
            const k = x.groupLabel || 'Առանց խմբի';
            groups[k] = groups[k] || { count: 0, sum: 0 };
            groups[k].count++;
            groups[k].sum += Number(x.amount) || 0;
        });
        const gRows = Object.entries(groups).sort((a, b) => b[1].sum - a[1].sum);
        $('groupTable').innerHTML = gRows.length
            ? `<tr><th>Խումբ</th><th class="num">Վճարումներ</th><th class="num">Գումար</th></tr>` +
              gRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.count}</td><td class="num">${fmt(v.sum)}</td></tr>`).join('') +
              `<tr class="total-row"><td>Ընդամենը</td><td class="num">${gRows.reduce((a, [, v]) => a + v.count, 0)}</td><td class="num">${fmt(s.tuition)}</td></tr>`
            : `<tr><td class="empty">Այս ժամանակահատվածում ուսման վճար չկա</td></tr>`;

        // Գործարքներ
        const txs = list.filter(x => typeFilter === 'all' || x.type === typeFilter)
            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        $('txTable').innerHTML = txs.length
            ? `<tr><th>Ամսաթիվ</th><th>Տեսակ</th><th>Նկարագրություն</th><th class="num">Գումար</th><th></th></tr>` +
              txs.map(x => `<tr>
                    <td>${esc(x.date)}</td>
                    <td><span class="tag ${esc(x.type)}">${TYPE_LABEL[x.type] || esc(x.type)}</span></td>
                    <td>${esc(x.title)}</td>
                    <td class="num ${x.type === 'expense' ? 'neg' : 'pos'}">${x.type === 'expense' ? '−' : '+'}${fmt(x.amount)}</td>
                    <td><button class="btn btn-del" data-del="${x.id}">X</button></td>
                </tr>`).join('')
            : `<tr><td class="empty">Գործարքներ չկան</td></tr>`;

        // Ամիսների աղյուսակ
        const t = calc(all);
        $('monthTable').innerHTML = `<tr><th>Ամիս</th><th class="num">Ուսման վճար</th><th class="num">Այլ եկամուտ</th><th class="num">Ընդհանուր եկամուտ</th><th class="num">Ծախս</th><th class="num">Մնացորդ</th></tr>` +
            months.map(m => {
                const c = calc(all.filter(x => x.monthKey === m));
                return `<tr class="clickable" data-month="${m}">
                    <td><b>${monthLabel(m)}</b></td>
                    <td class="num">${fmt(c.tuition)}</td><td class="num">${fmt(c.income)}</td>
                    <td class="num">${fmt(c.totalIn)}</td><td class="num neg">${fmt(c.expense)}</td>
                    <td class="num ${c.balance >= 0 ? 'pos' : 'neg'}"><b>${fmt(c.balance)}</b></td></tr>`;
            }).join('') +
            `<tr class="total-row clickable" data-month="all"><td>ԸՆԴԱՄԵՆԸ (ամբողջական)</td>
                <td class="num">${fmt(t.tuition)}</td><td class="num">${fmt(t.income)}</td>
                <td class="num">${fmt(t.totalIn)}</td><td class="num neg">${fmt(t.expense)}</td>
                <td class="num ${t.balance >= 0 ? 'pos' : 'neg'}">${fmt(t.balance)}</td></tr>`;
    }

    // Իրադարձություններ
    $('periodSelect').addEventListener('change', e => { period = e.target.value; render(); });
    $('tabs').addEventListener('click', e => {
        const tab = e.target.closest('.tab'); if (!tab) return;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        typeFilter = tab.dataset.type;
        render();
    });
    $('monthTable').addEventListener('click', e => {
        const tr = e.target.closest('tr[data-month]'); if (!tr) return;
        period = tr.dataset.month; render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    $('txTable').addEventListener('click', async e => {
        const btn = e.target.closest('[data-del]'); if (!btn) return;
        if (confirm('Ջնջե՞լ այս գործարքը:')) {
            await deleteDoc(doc(db, 'cash', btn.dataset.del));
            load();
        }
    });

    async function addEntry(type, titleId, amountId, dateId, form) {
        const title = $(titleId).value.trim();
        const amount = Number($(amountId).value);
        const date = $(dateId).value;
        if (!title || !(amount > 0) || !date) { alert('Լրացրեք բոլոր դաշտերը (գումարը՝ 0-ից մեծ)'); return; }
        try {
            await addDoc(collection(db, 'cash'), { type, title, amount, date, monthKey: date.slice(0, 7), createdAt: new Date() });
            form.reset();
            $('incDate').value = todayISO();
            $('expDate').value = todayISO();
            period = date.slice(0, 7);
            load();
        } catch (err) { alert('Սխալ: ' + err.message); }
    }
    $('incomeForm').addEventListener('submit', e => { e.preventDefault(); addEntry('income', 'incTitle', 'incAmount', 'incDate', e.target); });
    $('expenseForm').addEventListener('submit', e => { e.preventDefault(); addEntry('expense', 'expTitle', 'expAmount', 'expDate', e.target); });
</script>
</body>
</html>
